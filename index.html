<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apathy: Everyday Scenes & Reflections</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --border-color: #2c3e50;
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Times New Roman', 'Apple SD Gothic Neo', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        header { text-align: center; margin-bottom: 20px; }
        h1 { letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; }
        .instruction { font-style: italic; color: #5f6a6a; font-size: 0.9rem; }

        .main-work-area {
            width: 100%;
            max-width: 800px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* 캔버스 경계선 및 터치 방지 */
        #canvas-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: 2px solid var(--border-color);
            margin-bottom: 20px;
            touch-action: none; 
            overflow: hidden;
        }

        canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }

        /* 텍스트 박스 경계선 강화 */
        .reflection-area { width: 100%; border-top: 2px solid var(--border-color); padding-top: 15px; }
        .text-label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 0.8rem; }

        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            box-sizing: border-box;
            border: 2px solid var(--border-color);
            font-family: 'Georgia', serif;
            font-size: 1.1rem;
            line-height: 1.6;
            resize: none;
            outline: none;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            width: 100%;
            max-width: 800px;
        }

        .btn {
            padding: 10px 20px;
            background: var(--border-color);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
            flex: 1;
        }

        .btn-outline { background: #fff; color: var(--border-color); border: 2px solid var(--border-color); }

        @media print { .controls { display: none; } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<header>
    <h1>Project: Apathy</h1>
    <p class="instruction">Draw a scene of indifference and write your verse.</p>
</header>

<div class="main-work-area" id="capture-area">
    <div id="canvas-wrapper">
        <canvas id="drawingCanvas"></canvas>
    </div>
    
    <div class="reflection-area">
        <span class="text-label">VERSE OR APHORISM</span>
        <textarea placeholder="Write here..."></textarea>
    </div>
</div>

<div class="controls">
    <button class="btn btn-outline" onclick="clearCanvas()">Clear</button>
    <button class="btn" onclick="downloadPDF()">Save PDF</button>
</div>

<script>
    const canvas = document.getElementById('drawingCanvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('canvas-wrapper');

    // [중요] 캔버스 초기 설정 - 딱 한 번만 실행되도록 함
    let isInitialized = false;

    function initCanvas() {
        if (isInitialized) return; // 이미 설정되었다면 다시 실행하지 않음 (지워짐 방지)

        const rect = wrapper.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;

        // 캔버스 크기를 고해상도로 고정
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        
        ctx.scale(dpr, dpr);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#2c3e50';
        ctx.lineWidth = 2.5;
        
        isInitialized = true;
    }

    // 창 크기가 변해도 캔버스 크기를 재설정하지 않음 (스크롤 시 지워짐 차단)
    window.addEventListener('load', initCanvas);

    let isDrawing = false;
    let lastX = 0, lastY = 0;

    function getCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        // 스크롤 양을 고려하지 않는 getBoundingClientRect 좌표 사용
        return [clientX - rect.left, clientY - rect.top];
    }

    canvas.addEventListener('mousedown', (e) => {
        isDrawing = true;
        [lastX, lastY] = getCoords(e);
    });

    canvas.addEventListener('mousemove', (e) => {
        if (!isDrawing) return;
        const [x, y] = getCoords(e);
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(x, y);
        ctx.stroke();
        [lastX, lastY] = [x, y];
    });

    window.addEventListener('mouseup', () => isDrawing = false);

    // 아이패드 전용 터치 이벤트
    canvas.addEventListener('touchstart', (e) => {
        if(e.target === canvas) e.preventDefault();
        isDrawing = true;
        [lastX, lastY] = getCoords(e);
    }, {passive: false});

    canvas.addEventListener('touchmove', (e) => {
        if(e.target === canvas) e.preventDefault();
        if (!isDrawing) return;
        const [x, y] = getCoords(e);
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(x, y);
        ctx.stroke();
        [lastX, lastY] = [x, y];
    }, {passive: false});

    canvas.addEventListener('touchend', () => isDrawing = false);

    function clearCanvas() {
        if(confirm("지우시겠습니까?")) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    }

    async function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const element = document.getElementById('capture-area');
        const btn = document.querySelector('.btn');
        btn.innerText = "Processing...";

        try {
            const canvasImg = await html2canvas(element, { scale: 2 });
            const imgData = canvasImg.toDataURL('image/png');
            const pdf = new jsPDF('p', 'mm', 'a4');
            const pdfWidth = pdf.internal.pageSize.getWidth() - 20;
            const pdfHeight = (canvasImg.height * pdfWidth) / canvasImg.width;
            
            pdf.addImage(imgData, 'PNG', 10, 10, pdfWidth, pdfHeight);
            pdf.save('Apathy_Work.pdf');
        } catch (e) {
            alert("Error: " + e);
        } finally {
            btn.innerText = "Save PDF";
        }
    }
</script>

</body>
</html>
