
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apathy: Everyday Scenes & Reflections</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --container-bg: #ffffff;
            --border-color: #2c3e50;
            --accent-color: #34495e;
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Times New Roman', 'Apple SD Gothic Neo', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            max-width: 800px;
        }

        h1 {
            font-weight: 400;
            letter-spacing: 3px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        p.instruction {
            font-style: italic;
            color: #5f6a6a;
            line-height: 1.6;
            font-size: 1.05rem;
        }

        .main-work-area {
            width: 100%;
            max-width: 850px;
            background: var(--container-bg);
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            gap: 0; /* 박스 사이 간격을 없애고 경계선으로 구분 */
        }

        /* 캔버스 영역 */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border: 2px solid var(--border-color);
            background: #fff;
            touch-action: none;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
        }

        /* 텍스트 영역 - 경계선 강화 */
        .reflection-area {
            margin-top: 20px;
            width: 100%;
        }

        .text-label {
            display: block;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 20px;
            box-sizing: border-box;
            border: 2px solid var(--border-color); /* 사방 경계선을 굵고 분명하게 설정 */
            background-color: #fff;
            font-family: 'Georgia', serif;
            font-size: 1.15rem;
            line-height: 1.8;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: #7f8c8d;
        }

        /* 컨트롤 버튼 */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            width: 100%;
            max-width: 850px;
        }

        .btn {
            padding: 12px 24px;
            background: var(--border-color);
            border: 1px solid var(--border-color);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 4px;
            flex: 1;
        }

        .btn-outline {
            background: transparent;
            color: var(--border-color);
        }

        .btn:hover {
            opacity: 0.8;
        }

        .btn-outline:hover {
            background: var(--border-color);
            color: white;
        }

        footer {
            margin-top: 60px;
            font-size: 0.85rem;
            color: #95a5a6;
            text-align: center;
        }

        /* 출력 시 버튼 숨기기 */
        @media print {
            .controls, footer {
                display: none;
            }
            body {
                background-color: white;
                padding: 0;
            }
            .main-work-area {
                box-shadow: none;
                width: 100%;
                padding: 0;
            }
        }
    </style>
    <!-- PDF 생성을 위한 라이브러리 추가 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<header>
    <h1>Apathy & Everyday Scene</h1>
    <p class="instruction">
        Capture a moment of indifference in daily life.<br>
        Draw the scene above, and compose your verse or aphorism below.
    </p>
</header>

<div class="main-work-area" id="capture-area">
    <div id="canvas-wrapper">
        <canvas id="drawingCanvas"></canvas>
    </div>
    
    <div class="reflection-area">
        <span class="text-label">Verse or Aphorism</span>
        <textarea placeholder="Compose your thoughts here..."></textarea>
    </div>
</div>

<div class="controls">
    <button class="btn btn-outline" onclick="clearCanvas()">Clear (다시 그리기)</button>
    <button class="btn" onclick="downloadPDF()">Save as PDF (출력/저장)</button>
</div>

<footer>
    &copy; 2024 Educational Project: Reinterpreting Auden.
</footer>

<script>
    const canvas = document.getElementById('drawingCanvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('canvas-wrapper');

    function resizeCanvas() {
        const rect = wrapper.getBoundingClientRect();
        // 캔버스 크기 조정 시 기존 내용이 사라지지 않게 처리하려면 메모리 캔버스가 필요하지만,
        // 여기선 초기 로드 및 창 크기 변경 대응 위주로 설정합니다.
        canvas.width = rect.width * 2; // 고해상도 대응
        canvas.height = rect.height * 2;
        ctx.scale(2, 2);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#2c3e50';
        ctx.lineWidth = 2.5;
    }

    window.addEventListener('load', resizeCanvas);
    window.addEventListener('resize', resizeCanvas);

    let isDrawing = false;
    let lastX = 0;
    let lastY = 0;

    function getCoords(e) {
        const rect = canvas.getBoundingClientRect();
        let x, y;
        if (e.touches && e.touches.length > 0) {
            x = e.touches[0].clientX - rect.left;
            y = e.touches[0].clientY - rect.top;
        } else {
            x = e.clientX - rect.left;
            y = e.clientY - rect.top;
        }
        return [x, y];
    }

    function startDrawing(e) {
        isDrawing = true;
        [lastX, lastY] = getCoords(e);
    }

    function draw(e) {
        if (!isDrawing) return;
        const [x, y] = getCoords(e);
        
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(x, y);
        ctx.stroke();
        
        [lastX, lastY] = [x, y];
    }

    function stopDrawing() {
        isDrawing = false;
    }

    // Event Listeners
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDrawing);

    canvas.addEventListener('touchstart', (e) => {
        if(e.target == canvas) e.preventDefault();
        startDrawing(e);
    }, {passive: false});
    canvas.addEventListener('touchmove', (e) => {
        if(e.target == canvas) e.preventDefault();
        draw(e);
    }, {passive: false});
    canvas.addEventListener('touchend', stopDrawing);

    // 기능 함수
    function clearCanvas() {
        if(confirm("그림을 지우고 다시 그리시겠습니까?")) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    }

    async function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const element = document.getElementById('capture-area');
        
        // 버튼 잠시 숨기기 및 캡처
        try {
            const canvasImg = await html2canvas(element, {
                scale: 2,
                backgroundColor: "#ffffff"
            });
            const imgData = canvasImg.toDataURL('image/png');
            
            const pdf = new jsPDF('p', 'mm', 'a4');
            const imgProps = pdf.getImageProperties(imgData);
            const pdfWidth = pdf.internal.pageSize.getWidth() - 20;
            const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
            
            pdf.addImage(imgData, 'PNG', 10, 10, pdfWidth, pdfHeight);
            pdf.save('Apathy_Project_Work.pdf');
        } catch (error) {
            console.error("PDF 생성 중 오류 발생:", error);
            alert("PDF를 생성하는 중에 문제가 발생했습니다.");
        }
    }
</script>

</body>
</html>
